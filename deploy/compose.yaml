# Single-box self-host bundle (one operator, trusted machine). See deploy/README.md.
# Images under ghcr.io/sira-labs/khandaq-* are published by CI on push to main; or build locally
# from the Dockerfiles with the `build:` lines (uncomment them).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: khandaq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: khandaq
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "khandaq"]
      interval: 5s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_KEY:-khandaq-root}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_SECRET:-changeme}
    volumes: ["evidence:/data"]

  api:
    image: ghcr.io/sira-labs/khandaq-api:latest
    # build: { context: .., dockerfile: api/Dockerfile }
    env_file: [.env]
    environment:
      KHANDAQ_ROLE: api
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }  # evidence downloads read the object store (spec 014)
    # No published port: reach the API through the web app's /api proxy. Publishing 8000 would expose
    # it directly — with KHANDAQ_ENV=dev that means the dev login stub (anyone becomes admin).

  worker:
    image: ghcr.io/sira-labs/khandaq-api:latest
    # build: { context: .., dockerfile: api/Dockerfile }
    env_file: [.env]
    environment:
      KHANDAQ_ROLE: worker
      KHANDAQ_ADAPTER_RUNTIME: docker-socket
      # Spec 012: each run's egress forwarder runs from this same image, on this network (where the
      # bundled target lives; it also routes out to authorised remote targets).
      KHANDAQ_FORWARDER_IMAGE: ghcr.io/sira-labs/khandaq-api:latest
      KHANDAQ_ADAPTER_EGRESS_NETWORK: khandaq
    # Shape A (ADR-0009): the worker launches pinned adapter containers with per-run egress limited to
    # the in-scope target. The socket is root-equivalent on the host: only on a trusted machine.
    group_add: ["${DOCKER_GID:?set DOCKER_GID in .env to the host's docker group id (getent group docker)}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - run-evidence:/var/lib/khandaq/evidence
    depends_on:
      postgres: { condition: service_healthy }
      rustfs: { condition: service_started }

  web:
    image: ghcr.io/sira-labs/khandaq-web:latest
    # build: { context: .., dockerfile: web/Dockerfile }
    environment:
      KHANDAQ_API_UPSTREAM: api:8000
    depends_on: [api]
    # Loopback only: this bundle runs KHANDAQ_ENV=dev by default (no real sign-in). To serve other
    # machines, put TLS in front and set KHANDAQ_ENV=prod with the OIDC settings (deploy/README.md).
    ports: ["127.0.0.1:8080:80"]

  # Bundled intentionally-vulnerable local target for `make demo` and tests. Never a third party.
  vulnerable-target:
    image: ghcr.io/sira-labs/khandaq-vulnerable-target:latest
    # build: { context: ../deploy/targets/vulnerable-llm }
    profiles: ["demo"]

networks:
  default:
    name: khandaq  # fixed, so KHANDAQ_ADAPTER_EGRESS_NETWORK can name it

volumes:
  pgdata:
  evidence:
  run-evidence:  # evidence bytes when KHANDAQ_OBJECT_STORE_URL is empty (specs 012, 014)
