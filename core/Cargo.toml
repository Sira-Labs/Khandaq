# Khandaq Rust core workspace. khandaq-py is built by maturin (not a workspace member) so that
# `cargo test` over the workspace never links against libpython.
[workspace]
resolver = "2"
members = ["khandaq-core", "khandaq-cli"]
exclude = ["khandaq-py"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
