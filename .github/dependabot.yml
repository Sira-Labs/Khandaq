# Weekly dependency updates, grouped so minor/patch bumps arrive as one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /core
    schedule: { interval: weekly, day: monday }
    groups:
      cargo-minor: { update-types: [minor, patch] }
    labels: ["area: core", "dependencies"]
  - package-ecosystem: uv
    directory: /api
    schedule: { interval: weekly, day: monday }
    groups:
      python-minor: { update-types: [minor, patch] }
    labels: ["area: api", "dependencies"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    groups:
      npm-minor: { update-types: [minor, patch] }
    labels: ["area: web", "dependencies"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    labels: ["area: ci", "dependencies"]
  # NOTE: adapter Dockerfiles pin upstream tools to an EXACT version on purpose. Updates to
  # those pins are taken by hand, with the adapter's contract test, never automatically — an
  # upstream change can break the findings mapping. Dependabot only watches the base images.
  - package-ecosystem: docker
    directories: [/api, /web, /deploy]
    schedule: { interval: weekly, day: monday }
    labels: ["area: deploy", "dependencies"]
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
