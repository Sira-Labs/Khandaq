name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs come online as each part of the tree lands (see docs/roadmap/sprints.md):
#   api + core + bindings (now) → adapters (spec 005) → web (SPA, spec 007).
jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit || true   # advisory until deps are baselined

  bindings:
    name: python bindings
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core/khandaq-py }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install "maturin>=1.5,<2" pytest
      - run: . .venv/bin/activate && maturin develop
      - run: . .venv/bin/activate && pytest -q

  api:
    name: python api
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khandaq
          POSTGRES_PASSWORD: khandaq
          POSTGRES_DB: khandaq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khandaq" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      KHANDAQ_TEST_DATABASE_URL: postgresql+psycopg://khandaq:khandaq@localhost:5432/khandaq
    steps:
      - uses: actions/checkout@v7
      # The api depends on the khandaq_core wheel (built from the Rust workspace by maturin on uv sync).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.12" }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
