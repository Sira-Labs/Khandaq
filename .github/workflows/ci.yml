name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Jobs come online as each part of the tree lands (see docs/roadmap/sprints.md):
#   api + core + bindings (now) → adapters (spec 005) → web (SPA, spec 007).
jobs:
  core:
    name: rust core
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: core }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit || true   # advisory until deps are baselined

  bindings:
    name: python bindings${{ matrix.python != '3.15' && format(' ({0})', matrix.python) || '' }}
    runs-on: ubuntu-latest
    # 3.15 is what the image runs; 3.12 is the oldest version `requires-python` allows. The 3.15
    # job keeps the plain name, so a required check of that name still means the image's Python.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15", "3.12"]
    defaults:
      run: { working-directory: core/khandaq-py }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      # khandaq-py is outside the core workspace, so the core job's fmt/clippy/audit never saw it.
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit || true   # advisory, as in the core job
      - uses: actions/setup-python@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: python -m venv .venv && . .venv/bin/activate && pip install "maturin>=1.5,<2" pytest
      - run: . .venv/bin/activate && maturin develop
      - run: . .venv/bin/activate && pytest -q

  adapters:
    name: adapters (manifests + contract tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install pyyaml jsonschema pytest
      # What the ART image holds (spec 035): without it the tests that run the real tool on a
      # synthetic model would be skipped.
      - run: pip install -r adapters/art/requirements.txt
      - run: python adapters/_tooling/validate_manifests.py
      # Adapter contract tests: each adapter's parser must still emit schema-valid findings.
      - run: pytest --import-mode=importlib adapters/*/tests -q
      # The same tests again, as errors if any was skipped: a missing dependency must not
      # turn the ART run tests into a silent pass.
      - run: pytest --import-mode=importlib adapters/art/tests -q -rs | tee /tmp/art.txt && ! grep -q skipped /tmp/art.txt

  api:
    name: python api${{ matrix.python != '3.15' && format(' ({0})', matrix.python) || '' }}
    runs-on: ubuntu-latest
    # 3.15 is what the image runs; 3.12 is the oldest version `requires-python` allows. The 3.15
    # job keeps the plain name, so a required check of that name still means the image's Python.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.15", "3.12"]
    defaults:
      run: { working-directory: api }
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: khandaq
          POSTGRES_PASSWORD: khandaq
          POSTGRES_DB: khandaq
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U khandaq" --health-interval 5s
          --health-timeout 5s --health-retries 10
      # The evidence object store the deployments pin (spec 014): write-once and versioning are
      # checked against the real thing, not only the fake client. Synthetic credentials.
      rustfs:
        image: rustfs/rustfs:1.0.0
        env:
          RUSTFS_ACCESS_KEY: khandaq-ci
          RUSTFS_SECRET_KEY: khandaq-ci-synthetic
        ports: ["9000:9000"]
    env:
      KHANDAQ_TEST_DATABASE_URL: postgresql+psycopg://khandaq:khandaq@localhost:5432/khandaq
      KHANDAQ_TEST_S3_ENDPOINT: http://localhost:9000
      KHANDAQ_TEST_S3_ACCESS_KEY_ID: khandaq-ci
      KHANDAQ_TEST_S3_SECRET_ACCESS_KEY: khandaq-ci-synthetic
    steps:
      - uses: actions/checkout@v7
      # The api depends on the khandaq_core wheel (built from the Rust workspace by maturin on uv sync).
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "${{ matrix.python }}" }
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q

  e2e:
    name: e2e (docker egress containment)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: api }
    env:
      KHANDAQ_E2E_DOCKER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: core }
      - uses: astral-sh/setup-uv@v7
        with: { python-version: "3.15" }
      - run: uv sync --extra dev
      # Real daemon: an adapter must reach its in-scope target and nothing else (spec 012, ADR-0009).
      - run: uv run pytest -q tests/e2e -rA

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
