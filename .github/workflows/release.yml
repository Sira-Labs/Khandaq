name: release

# Build and publish the control-plane and web images to GHCR so the CapRover one-click and the
# compose bundle can pull them (ghcr.io/sira-labs/khandaq-api, -web). `latest` tracks main;
# v* tags and a short SHA tag are also published.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: khandaq-api
            file: api/Dockerfile
            context: .
          - name: khandaq-web
            file: web/Dockerfile
            context: .
          - name: khandaq-adapter-garak
            file: adapters/garak/Dockerfile
            context: adapters/garak
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sira-labs/${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
