name: Bug report
description: Something in Khandaq behaves incorrectly
labels: ["type: bug", "needs: triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do **not** include real engagement data, live targets, credentials or captured evidence.
        If this is a scope-lock bypass, audit/evidence tampering, auth bypass or container escape,
        report it privately via a security advisory instead.
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: core / api / adapter (which) / web / deploy
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Use the bundled local target or synthetic data — never a real system.
    validations: { required: true }
