# garak adapter (specs 006, 027). garak is NVIDIA's LLM vulnerability scanner (Apache-2.0).
# Khandaq orchestrates it (ADR-0001); this manifest pins an exact upstream version.
name: garak
version: "0.17.0"                 # exact upstream version; bump deliberately with the contract test
image: ghcr.io/sira-labs/khandaq-adapter-garak:0.17.0
entrypoint: /usr/local/bin/wrap.py
phases:
  - 03-scanning
  - 04-prompt-injection
frameworks:
  - owasp-llm-2025
  - owasp-llm-2026
  - atlas
# The adapter derives high/medium/low from each probe's failure rate; this table is the
# native->canonical identity map (ADR-0004).
severity_table:
  high: high
  medium: medium
  low: low
resources:
  cpu: "1"
  memory: 2Gi
# garak cannot hold a requests-per-minute limit itself (spec 027) ...
paces_requests: false
# ... but it speaks plain HTTP/1.1 (openai client over httpx, HTTP/2 off, no pipelining), so the
# per-run egress forwarder holds the rate for it and a capped engagement can run it (spec 032).
# Re-check this when the pinned version moves.
forwarder_paced: true
# garak consumes KHANDAQ_TARGET_CREDENTIAL as its generator's API key (spec 028); a target's
# credential is injected only into adapters that declare this.
accepts_credential: true
