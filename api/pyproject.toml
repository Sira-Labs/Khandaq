[project]
name = "khandaq-api"
version = "0.1.0"
description = "Khandaq control plane — a command post for authorised AI red-team engagements."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    # Pinned to the lines validated for spec 001 (the 2.1 / 3.3 lines are brand-new; revisit together).
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
khandaq-worker = "khandaq.worker:main"
khandaq-db = "khandaq.migrate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khandaq"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["khandaq"]
mypy_path = "src"
ignore_missing_imports = true
